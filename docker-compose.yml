services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mountain_gateway
    ports:
      - "8000:8000"
    environment:
      - GATEWAY_REDIS_URL=redis://redis:6379/0
      - GATEWAY_STORAGE_BACKEND=mongodb
      - GATEWAY_MONGODB_URI=mongodb://mongodb:27017
      - GATEWAY_MONGODB_DATABASE=gateway
      - GATEWAY_MONGODB_COLLECTION=routes
      - GATEWAY_SEED_ROUTES_FILE=/app/config/routes.json
      - GATEWAY_ROUTES_FILE_PATH=/app/config/routes.json
      - GATEWAY_LOG_FORMAT=json
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8000
    volumes:
      - ./config/routes.json:/app/config/routes.json
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      echo-service:
        condition: service_healthy
      slow-service:
        condition: service_healthy
      flaky-service:
        condition: service_healthy
      hasher-service:
        condition: service_healthy
      pipeline-service:
        condition: service_healthy
    networks:
      - gateway-net

  redis:
    image: redis:7-alpine
    container_name: mountain_redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway-net

  mongodb:
    image: mongo:7.0
    container_name: mountain_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway-net

  echo-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mountain_echo
    ports:
      - "8001:8001"
    entrypoint: ["uvicorn", "mock_backend_services.echo_service:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway-net

  slow-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mountain_slow
    ports:
      - "8002:8002"
    entrypoint: ["uvicorn", "mock_backend_services.slow_service:app", "--host", "0.0.0.0", "--port", "8002"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway-net

  flaky-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mountain_flaky
    ports:
      - "8003:8003"
    entrypoint: ["uvicorn", "mock_backend_services.flaky_service:app", "--host", "0.0.0.0", "--port", "8003"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway-net

  hasher-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mountain_hasher
    ports:
      - "8004:8004"
    entrypoint: ["uvicorn", "mock_backend_services.hasher_service:app", "--host", "0.0.0.0", "--port", "8004"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway-net

  pipeline-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mountain_pipeline
    ports:
      - "8005:8005"
    entrypoint: ["uvicorn", "mock_backend_services.data_pipeline_service:app", "--host", "0.0.0.0", "--port", "8005"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gateway-net

volumes:
  redis_data:
  mongo_data:

networks:
  gateway-net:
    driver: bridge
